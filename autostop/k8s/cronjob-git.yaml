# git-pull mode: an initContainer clones GIT_REPO@GIT_REF on every run;
# config still comes from ConfigMap "autostop-config" (generated by deploy.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autostop-manager
  labels:
    app.kubernetes.io/name: autostop-manager
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: autostop-manager
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
          initContainers:
            - name: git-clone
              image: alpine/git:2.47.2
              command: ["/bin/sh", "-c"]
              args:
                - git clone --depth 1 --branch "$GIT_REF" "$GIT_REPO" /src
              env:
                - name: GIT_REPO
                  value: "https://github.com/bjornrobertsson/coder-manipulate-ttl-and-workspaces.git"
                - name: GIT_REF
                  value: "master"
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: src, mountPath: /src}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: autostop
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  pip install --no-cache-dir --disable-pip-version-check -q --target /deps -r /src/autostop/requirements.txt &&
                  exec python /src/autostop/autostop_manager.py
              env:
                - name: CONFIG_PATH
                  value: /config/config.yaml
                - name: PYTHONPATH
                  value: /deps
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: autostop-secrets
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: src, mountPath: /src, readOnly: true}
                - {name: config, mountPath: /config, readOnly: true}
                - {name: deps, mountPath: /deps}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: src
              emptyDir: {}
            - name: config
              configMap: {name: autostop-config}
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
