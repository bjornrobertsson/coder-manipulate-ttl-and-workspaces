# ConfigMap mode: script + requirements from ConfigMap "autostop-script",
# config from ConfigMap "autostop-config" (both generated by deploy.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autostop-manager
  labels:
    app.kubernetes.io/name: autostop-manager
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: autostop-manager
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
          containers:
            - name: autostop
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  pip install --no-cache-dir --disable-pip-version-check -q --target /deps -r /app/requirements.txt &&
                  exec python /app/autostop_manager.py
              env:
                - name: CONFIG_PATH
                  value: /config/config.yaml
                - name: PYTHONPATH
                  value: /deps
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: autostop-secrets
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
                - {name: config, mountPath: /config, readOnly: true}
                - {name: deps, mountPath: /deps}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: autostop-script}
            - name: config
              configMap: {name: autostop-config}
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
