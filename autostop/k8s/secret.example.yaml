# Example only - do NOT commit real values. Create with:
#   kubectl -n coder create secret generic autostop-secrets \
#     --from-literal=CODER_URL=https://coder.example.com \
#     --from-literal=CODER_TOKEN=<token> \
#     --from-literal=SMTP_USERNAME= --from-literal=SMTP_PASSWORD=
# Token needs template-admin (or owner) rights to read users' emails and stop workspaces.
apiVersion: v1
kind: Secret
metadata:
  name: autostop-secrets
type: Opaque
stringData:
  CODER_URL: "https://coder.example.com"
  CODER_TOKEN: "REPLACE_ME"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
